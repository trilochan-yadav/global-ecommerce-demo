<div class="container py-4" style="max-width: 540px">
  <h3 class="mb-4">Checkout</h3>

  @if (loadError()) {
    <div class="alert alert-danger">{{ loadError() }}</div>
  }

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  }

  @if (product(); as p) {
    @if (!loading()) {
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <h5>{{ p.name }}</h5>
          <p class="mb-1">{{ p.price | number: '1.2-2' }} each</p>
          <p class="text-muted small">{{ p.stockQuantity }} in stock</p>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input
          type="number"
          class="form-control"
          [class.is-invalid]="quantityError()"
          [value]="quantity()"
          (input)="quantity.set(+$any($event.target).value)"
          min="1"
          [max]="p.stockQuantity"
        />
        @if (quantityError()) {
          <div class="invalid-feedback">{{ quantityError() }}</div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">Payment scenario</label>
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="scenario"
            id="scValid"
            [checked]="scenario() === 'valid'"
            (change)="scenario.set('valid')"
          />
          <label class="form-check-label" for="scValid">Valid payment</label>
        </div>
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="scenario"
            id="scDecline"
            [checked]="scenario() === 'decline'"
            (change)="scenario.set('decline')"
          />
          <label class="form-check-label text-danger" for="scDecline">Simulate decline</label>
        </div>
      </div>

      @if (orderError()) {
        <div class="alert alert-danger">{{ orderError() }}</div>
      }

      <button
        class="btn btn-success w-100"
        [disabled]="placing() || !!quantityError()"
        (click)="placeOrder()"
      >
        {{
          placing()
            ? 'Placing order…'
            : 'Place Order — $' + (p.price * quantity() | number: '1.2-2')
        }}
      </button>
    }
  }
</div>
