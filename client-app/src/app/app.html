@if (auth.isLoggedIn()) {
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/products">GlobalShop</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/orders" routerLinkActive="active">Orders</a>
          </li>
          @if (auth.role() === 'Admin') {
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin/analytics" routerLinkActive="active"
                >Analytics</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin/logs" routerLinkActive="active">Logs</a>
            </li>
          }
        </ul>
        <span class="navbar-text me-3 text-light small">{{ auth.username() }}</span>
        <button class="btn btn-outline-light btn-sm" (click)="auth.logout()">Sign out</button>
      </div>
    </div>
  </nav>
}

<router-outlet />

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast show align-items-center text-bg-{{ t.type }} border-0 mb-2" role="alert">
      <div class="d-flex">
        <div class="toast-body fw-semibold">{{ t.message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
          (click)="toast.dismiss(t.id)"></button>
      </div>
    </div>
  }
</div>
